<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinalsOS Collector</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { width: 292px; margin: 0; padding: 18px; color: #172033; background: #fff; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #e4ebff; color: #245eea; font-weight: 900; font-size: 22px; }
    h1 { margin: 0 0 3px; font-size: 16px; letter-spacing: -.3px; }
    .sub { color: #64748b; font-size: 12px; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 20px; padding: 14px; border: 1px solid #dbe3f0; border-radius: 13px; background: #f8faff; }
    .setting-title { font-size: 13px; font-weight: 800; }
    .setting-desc { margin-top: 5px; color: #64748b; font-size: 11px; line-height: 1.45; }
    .switch { position: relative; flex: 0 0 auto; width: 44px; height: 26px; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .slider { position: absolute; inset: 0; border-radius: 99px; background: #cbd5e1; cursor: pointer; transition: background .15s; }
    .slider::before { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0002; transition: transform .15s; }
    .switch input:checked + .slider { background: #245eea; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:focus-visible + .slider { outline: 3px solid #a7bcff; outline-offset: 2px; }
    #status { min-height: 16px; margin-top: 12px; color: #64748b; font-size: 11px; line-height: 1.4; }
    .foot { border-top: 1px solid #edf0f6; margin-top: 12px; padding-top: 12px; color: #8490a3; font-size: 10px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="mark" aria-hidden="true">F</div>
    <div>
      <h1>FinalsOS Collector</h1>
      <div class="sub">Automatic lesson capture</div>
    </div>
  </div>

  <div class="setting">
    <div>
      <div class="setting-title">Automatic save prompts</div>
      <div class="setting-desc" id="setting-desc">When enabled, videos and reading lessons ask before saving.</div>
    </div>
    <label class="switch" aria-label="Enable automatic save prompts">
      <input id="enabled" type="checkbox" role="switch" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div id="status" role="status" aria-live="polite">Loading setting…</div>
  <div class="foot">OFF stops future prompts. Nothing is saved unless you confirm in a prompt.</div>
  <script src="popup.js"></script>
</body>
</html>
